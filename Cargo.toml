[package]
name = "mdterm"
version = "0.1.0"
edition = "2021"

[lib]
name = "mdterm"
path = "src/lib.rs"

[dependencies]
actix-web = "4.9"
actix-ws = "0.3"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
notify = "7.0"
ignore = "0.4"
pty-process = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
base64 = "0.22"
futures = "0.3"

[dev-dependencies]
actix-rt = "2.10"
tempfile = "3.13"
